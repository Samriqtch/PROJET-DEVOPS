name: CI/CD Pipeline - Calculatrice

on:
  push:
    branches: [ main, "feature/*" ]
  pull_request:
    branches: [ main ]

jobs:

  # JOB 1 — Vérification du code (Linting)
  lint:
    name: Vérification du code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Installer les dépendances
        run: npm install
      - name: Lancer le linting
        run: npx eslint src/script.js --no-eslintrc -c '{"rules":{"no-unused-vars":"warn","no-undef":"warn"}}'

  #  JOB 2 — Tests automatiques
  test:
    name: Tests automatiques
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Valider les fonctions JS
        run: |
          node -e "
            $(cat src/script.js)
            let ok = true;
            if (addition(2,3) !== 5)     { console.error('FAIL addition(2,3)');     ok=false; }
            if (soustraction(5,2) !== 3)  { console.error('FAIL soustraction(5,2)'); ok=false; }
            if (addition(-1,1) !== 0)     { console.error('FAIL addition(-1,1)');    ok=false; }
            if (ok) console.log('Tous les tests passent !');
            else process.exit(1);
          "

  #  JOB 3 — Build (validation structure)
  build:
    name: Validation du build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v3
      - name: Vérifier la structure du projet
        run: |
          echo "Structure du projet :"
          ls -la
          echo "Fichiers src :"
          ls src/
          echo "Fichiers css :"
          ls css/
          echo "Build validé !"

  #  JOB 4 — Déploiement (GitHub Pages)
  deploy:
    name: Déploiement GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      - name: Déployer sur GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./